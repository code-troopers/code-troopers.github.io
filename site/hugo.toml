locale = "fr-FR"
defaultContentLanguage = "fr"
disableKinds = ["RSS", "taxonomy"]
title = "Code-Troopers"
baseurl = "/"

[security]
enableInlineShortcodes = false
# Hugo >= 0.164 denies text/html content files by default; the homepage is content/_index.html
allowContent = ["^text/(markdown|html|asciidoc)$"]

[security.exec]
allow = ["^dart-sass-embedded$", "^go$", "^npx$", "^postcss$", "^asciidoctor$"]
osEnv = ["(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM|RUBYLIB)$"]

[security.funcs]
getenv = ["^HUGO_"]

[security.http]
methods = ["(?i)GET|POST"]
urls = [".*"]

[params]
siteUrl = "https://code-troopers.com"
images = ["img/logo-code-troopers-tête-couleur.png"]

[markup]

[markup.goldmark]

[markup.goldmark.parser.attribute]
block = true

[markup.goldmark.renderer]
unsafe = true

[taxonomies]
  category = 'categories'
  series = 'series'
  tag = 'tags'

